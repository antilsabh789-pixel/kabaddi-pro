# Nixpacks configuration for Railway deployment
# This tells Railway's build system to use pnpm (not npm) and how to build/start the api-server.
#
# The api-server lives in `artifacts/api-server/` but depends on workspace
# packages in `lib/api-zod/` and `lib/db/`. So we install from the repo root
# (which has `pnpm-workspace.yaml`) and then build only the api-server.

[phases.setup]
nixPkgs = ["nodejs_22"]
nixOverlays = []

[phases.install]
dependsOn = ["setup"]
cmds = [
  "corepack enable pnpm",
  "pnpm install --no-frozen-lockfile"
]

[phases.build]
dependsOn = ["install"]
cmds = [
  "pnpm --filter @workspace/api-server run build"
]

[start]
cmd = "node --enable-source-maps ./artifacts/api-server/dist/index.mjs"
