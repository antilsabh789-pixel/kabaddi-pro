kind = "web"
previewPath = "/"
title = "Kabaddi Pro"
version = "1.0.0"
id = "artifacts/kabaddi-pro"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25700

[services.development]
run = "pnpm --filter @workspace/kabaddi-pro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kabaddi-pro", "run", "build" ]
publicDir = "artifacts/kabaddi-pro/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25700"
BASE_PATH = "/"
