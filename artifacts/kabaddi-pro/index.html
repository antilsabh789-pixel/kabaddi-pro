    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
    <script>
      // ─── Runtime API base URL ────────────────────────────────────────
      // This MUST be set when the frontend is hosted on a different origin
      // than the API (e.g. frontend on Vercel, API on Railway). Without it,
      // `/api/*` requests fall through to Vercel's SPA rewrite and return
      // index.html — which causes "Unexpected token '<'" JSON parse errors
      // in every fetch call.
      //
      // RESOLUTION ORDER (see src/lib/apiBase.ts):
      //   1. window.__API_BASE_URL__ (set here or by a deploy-time script)
      //   2. localStorage.getItem('apiBaseUrl')  — for QA/testing
      //   3. import.meta.env.VITE_API_BASE_URL   — set at build time on Vercel
      //   4. ''  — fall back to same-origin (Vite dev proxy)
      //
      // TO SET AT DEPLOY TIME (no rebuild needed):
      //   - Vercel: add a Build Step that runs:
      //       sed -i 's|__API_BASE_URL__=.*|__API_BASE_URL__="https://YOUR-RAILWAY-URL.up.railway.app";|' index.html
      //     OR set VITE_API_BASE_URL in Vercel → Settings → Environment Variables
      //     (the latter requires a rebuild to take effect)
      //
      // TO SET FOR TESTING (per-browser):
      //   localStorage.setItem('apiBaseUrl', 'https://your-api.example.com')
      //   then reload the page
      window.__API_BASE_URL__ = ""; // <-- populated by deploy script or left empty
    </script>
    <script>
      // ─── Theme bootstrap — runs BEFORE any CSS/React loads ───────────
      // Reads the user's saved theme preference and applies the `.dark` class
      // to <html> immediately. This eliminates:
      //   - Flash of wrong theme on app open
      //   - Race condition between zustand persist hydration and React's first paint
      //   - Any chance of the OS's dark mode bleeding through before the app's
      //     saved preference is applied
      //
      // We read from TWO localStorage keys:
      //   1. 'theme-mode' — standalone key set by setDarkMode() (most reliable)
      //   2. 'kabaddi-pro-storage' — zustand persist key (fallback)
      //
      // If neither exists (first visit), default to light mode.
      (function() {
        try {
          var isDark = false;

          // Try the standalone key first — it's simple and always in sync
          var themeMode = localStorage.getItem('theme-mode');
          if (themeMode === 'dark') {
            isDark = true;
          } else if (themeMode === 'light') {
            isDark = false;
          } else {
            // Standalone key doesn't exist yet — fall back to zustand persist
            var raw = localStorage.getItem('kabaddi-pro-storage');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.state && parsed.state.darkMode === true) {
                isDark = true;
              }
            }
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // If anything fails, default to light mode
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
