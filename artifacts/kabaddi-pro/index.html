    <script>
      // ─── Theme bootstrap — runs BEFORE any CSS/React loads ───────────
      // Reads the user's saved theme preference and applies the `.dark` class
      // to <html> immediately. This eliminates:
      //   - Flash of wrong theme on app open
      //   - Race condition between zustand persist hydration and React's first paint
      //   - Any chance of the OS's dark mode bleeding through before the app's
      //     saved preference is applied
      //
      // We read from TWO localStorage keys:
      //   1. 'theme-mode' — standalone key set by setDarkMode() (most reliable)
      //   2. 'kabaddi-pro-storage' — zustand persist key (fallback)
      //
      // If neither exists (first visit), default to light mode.
      (function() {
        try {
          var isDark = false;

          // Try the standalone key first — it's simple and always in sync
          var themeMode = localStorage.getItem('theme-mode');
          if (themeMode === 'dark') {
            isDark = true;
          } else if (themeMode === 'light') {
            isDark = false;
          } else {
            // Standalone key doesn't exist yet — fall back to zustand persist
            var raw = localStorage.getItem('kabaddi-pro-storage');
            if (raw) {
              var parsed = JSON.parse(raw);
              if (parsed && parsed.state && parsed.state.darkMode === true) {
                isDark = true;
              }
            }
          }

          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          // If anything fails, default to light mode
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
